<!-- Header con gradiente -->
<div class="bg-gradient-to-r from-primary-600 to-primary-700 rounded-t-lg px-6 py-4 shadow-sm mb-6">
  <div class="flex items-center gap-3">
    <button
      (click)="goToInbox()"
      class="text-white hover:bg-white/20 rounded-lg p-2 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
    </button>
    <div>
      <h1 class="text-xl font-bold text-white">Nuevo mensaje</h1>
      <p class="text-xs text-primary-100">Envía un mensaje interno</p>
    </div>
  </div>
</div>

<!-- Content area -->
<form [formGroup]="form" (ngSubmit)="sendEmail()" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-3xl mx-auto">
  <!-- Error message -->
  <div *ngIf="error" class="mb-6">
    <div class="bg-red-50 border-l-4 border-red-500 rounded-lg p-4">
      <div class="flex items-start gap-3">
        <svg class="w-6 h-6 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div>
          <p class="text-red-800 font-semibold">Error</p>
          <p class="text-red-700 text-sm mt-1">{{ error }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Destinatario -->
  <div class="mb-5">
    <label class="block text-sm font-semibold text-gray-700 mb-2">
      Destinatario <span class="text-red-500">*</span>
    </label>
    <select
      formControlName="destinatarioId"
      class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700">
      <option value="" disabled>Selecciona un usuario</option>
      <option *ngFor="let user of users" [value]="user.id">
        {{ user.nombre || user.correoElectronico }} ({{ user.correoElectronico }})
      </option>
    </select>
    <div *ngIf="form.get('destinatarioId')?.touched && form.get('destinatarioId')?.invalid"
      class="mt-2 text-red-600 text-sm flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Debes seleccionar un destinatario</span>
    </div>
  </div>

  <!-- Asunto -->
  <div class="mb-5">
    <label class="block text-sm font-semibold text-gray-700 mb-2">
      Asunto <span class="text-red-500">*</span>
    </label>
    <input
      type="text"
      formControlName="asunto"
      class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700"
      placeholder="Asunto del mensaje" />
    <div *ngIf="form.get('asunto')?.touched && form.get('asunto')?.invalid"
      class="mt-2 text-red-600 text-sm flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>El asunto es obligatorio y máximo 100 caracteres</span>
    </div>
  </div>

  <!-- Mensaje -->
  <div class="mb-6">
    <label class="block text-sm font-semibold text-gray-700 mb-2">
      Mensaje <span class="text-red-500">*</span>
    </label>
    <textarea
      formControlName="cuerpo"
      rows="8"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700 resize-none"
      placeholder="Escribe tu mensaje..."></textarea>
    <div *ngIf="form.get('cuerpo')?.touched && form.get('cuerpo')?.invalid"
      class="mt-2 text-red-600 text-sm flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>El mensaje es obligatorio y máximo 1000 caracteres</span>
    </div>
  </div>

  <!-- Buttons -->
  <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
    <button
      type="button"
      (click)="goToInbox()"
      class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors font-medium">
      Cancelar
    </button>
    <button
      type="submit"
      [disabled]="form.invalid || loading"
      class="px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl flex items-center gap-2">
      <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>{{ loading ? 'Enviando...' : 'Enviar mensaje' }}</span>
    </button>
  </div>
</form>
