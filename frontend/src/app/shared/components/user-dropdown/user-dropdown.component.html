<div class="relative user-dropdown" (clickOutside)="onClickOutside($event)">
  <!-- Botón de Usuario -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex items-center gap-2 p-2 text-gray-600 hover:text-primary-600 hover:bg-gray-100 rounded-lg transition-colors duration-200"
    aria-label="Menú de usuario"
  >
    <!-- Avatar con iniciales -->
    <div class="w-8 h-8 bg-primary-500 text-white rounded-full flex items-center justify-center text-sm font-semibold">
      {{ userInitials }}
    </div>

    <!-- Icono de dropdown -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    *ngIf="isOpen"
    class="absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50"
  >
    <!-- Header - Información del usuario -->
    <div class="px-4 py-3 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <!-- Avatar más grande -->
        <div class="w-12 h-12 bg-primary-500 text-white rounded-full flex items-center justify-center text-lg font-semibold">
          {{ userInitials }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-800 truncate">{{ userFullName }}</p>
          <p class="text-xs text-gray-500">{{ userRole }}</p>
        </div>
      </div>
    </div>

    <!-- Opción: Cerrar Sesión -->
    <div class="mt-1">
      <button
        type="button"
        (click)="logout()"
        class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 transition-colors duration-150 flex items-center gap-3"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</div>
