<div class="calendar-container bg-white rounded-xl shadow-sm border border-gray-200 p-4" style="min-height: 700px;">
  <div class="calendar-header flex justify-between items-center mb-4">
    <h3 class="text-lg font-semibold text-gray-800">Calendario de Tareas</h3>
    <div class="flex gap-2">
      <button
        class="px-3 py-1 text-sm bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors"
        (click)="goToToday()">
        Hoy
      </button>
    </div>
  </div>

  <div style="width: 100%; height: 600px;">
    <ejs-schedule
      #scheduleObj
      [selectedDate]="selectedDate"
      [eventSettings]="eventSettings"
      [views]="views"
      [currentView]="currentView"
      (eventClick)="onEventClick($event)"
      (popupOpen)="onPopupOpen($event)"
      height="100%"
      width="100%"
      [readonly]="true">
    </ejs-schedule>
  </div>
</div>
