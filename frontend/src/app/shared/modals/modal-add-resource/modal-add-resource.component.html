<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[9999] p-4" (click)="close()">
  <!-- Modal Container -->
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-y-auto max-h-[90vh]" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="flex justify-between items-center p-6 border-b border-gray-200">
      <h2 class="text-xl font-bold text-gray-800">{{ modalTitle }}</h2>
      <button
        (click)="close()"
        type="button"
        class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form (ngSubmit)="submit()" class="p-6">
      <!-- Error Message -->
      <div *ngIf="error" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-sm text-red-600">{{ error }}</p>
      </div>

      <!-- Tipo de Recurso -->
      <div class="mb-3">
        <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1">
          Tipo de Recurso <span class="text-red-500">*</span>
        </label>
        <select
          id="tipo"
          [(ngModel)]="tipo"
          name="tipo"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm">
          <option value="">Seleccionar tipo...</option>
          <option [value]="TipoRecurso.HUMANO">Humano</option>
          <option [value]="TipoRecurso.MATERIAL">Material</option>
          <option [value]="TipoRecurso.FINANCIERO">Financiero</option>
        </select>
      </div>

      <!-- Nombre -->
      <div class="mb-3">
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input
          id="nombre"
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          required
          placeholder="Ej: Juan Pérez, Laptop HP, Presupuesto Marketing"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" />
      </div>

      <!-- Descripción -->
      <div class="mb-3">
        <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">
          Descripción (opcional)
        </label>
        <textarea
          id="descripcion"
          [(ngModel)]="descripcion"
          name="descripcion"
          rows="2"
          placeholder="Detalles adicionales del recurso..."
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-none text-sm"></textarea>
      </div>

      <!-- Asignación -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Asignar recurso a:
        </label>
        <div class="space-y-2">
          <!-- Radio: Proyecto completo -->
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="assignmentType"
              value="proyecto"
              [(ngModel)]="assignmentType"
              (change)="onAssignmentTypeChange()"
              class="w-4 h-4 text-primary-600 focus:ring-primary-500" />
            <span class="text-sm text-gray-700">Todo el proyecto (recurso general)</span>
          </label>

          <!-- Radio: Tarea específica -->
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="assignmentType"
              value="tarea"
              [(ngModel)]="assignmentType"
              (change)="onAssignmentTypeChange()"
              class="w-4 h-4 text-primary-600 focus:ring-primary-500" />
            <span class="text-sm text-gray-700">Una tarea específica</span>
          </label>

          <!-- Radio: Subtarea específica -->
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="assignmentType"
              value="subtarea"
              [(ngModel)]="assignmentType"
              (change)="onAssignmentTypeChange()"
              class="w-4 h-4 text-primary-600 focus:ring-primary-500" />
            <span class="text-sm text-gray-700">Una subtarea específica</span>
          </label>
        </div>
      </div>

      <!-- Selector de Tarea (si aplica) -->
      <div *ngIf="assignmentType === 'tarea' || assignmentType === 'subtarea'" class="mb-3">
        <label for="tarea" class="block text-sm font-medium text-gray-700 mb-1">
          Tarea <span class="text-red-500">*</span>
        </label>
        <select
          id="tarea"
          [(ngModel)]="tareaId"
          (ngModelChange)="onTaskChange()"
          name="tarea"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm">
          <option [ngValue]="null">Seleccionar tarea...</option>
          <option *ngFor="let task of tasks" [ngValue]="task.id">{{ task.nombre }}</option>
        </select>
      </div>

      <!-- Selector de Subtarea (si aplica) -->
      <div *ngIf="assignmentType === 'subtarea'" class="mb-3">
        <label for="subtarea" class="block text-sm font-medium text-gray-700 mb-1">
          Subtarea <span class="text-red-500">*</span>
        </label>
        <select
          id="subtarea"
          [(ngModel)]="subtareaId"
          name="subtarea"
          required
          [disabled]="!tareaId"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm disabled:bg-gray-100 disabled:cursor-not-allowed">
          <option [ngValue]="null">{{ tareaId ? 'Seleccionar subtarea...' : 'Primero selecciona una tarea' }}</option>
          <option *ngFor="let subtask of filteredSubtasks" [ngValue]="subtask.id">{{ subtask.titulo }}</option>
        </select>
      </div>

      <!-- Cantidad y Costo en la misma línea -->
      <div class="grid grid-cols-2 gap-3 mb-4">
        <!-- Cantidad -->
        <div>
          <label for="cantidad" class="block text-sm font-medium text-gray-700 mb-1">
            Cantidad (opcional)
          </label>
          <input
            id="cantidad"
            type="number"
            [(ngModel)]="cantidad"
            name="cantidad"
            min="0"
            step="0.01"
            placeholder="0"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" />
        </div>

        <!-- Costo -->
        <div>
          <label for="costo" class="block text-sm font-medium text-gray-700 mb-1">
            Costo (opcional)
          </label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-gray-500 text-sm">$</span>
            <input
              id="costo"
              type="number"
              [(ngModel)]="costo"
              name="costo"
              min="0"
              step="0.01"
              placeholder="0.00"
              class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" />
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex gap-3 justify-center pt-4 border-t border-gray-200 mt-4 bg-gray-50">
        <button
          type="button"
          (click)="close()"
          [disabled]="loading"
          class="px-6 py-2.5 bg-gray-300 text-gray-800 rounded-lg font-semibold border-2 border-gray-400 hover:bg-gray-400 disabled:opacity-60 disabled:cursor-not-allowed transition-colors">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="loading"
          class="px-6 py-2.5 bg-green-600 text-white rounded-lg font-semibold border-2 border-green-700 hover:bg-green-700 disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-2 min-w-[180px] justify-center transition-colors">
          <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-white text-sm">{{ isEditMode ? 'ACTUALIZAR RECURSO' : 'AGREGAR RECURSO' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
