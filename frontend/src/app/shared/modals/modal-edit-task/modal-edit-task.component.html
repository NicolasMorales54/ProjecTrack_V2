<div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4" (click)="onClose()">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col transform transition-all" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="bg-gradient-to-r from-primary-600 to-primary-700 px-6 py-4 flex justify-between items-center flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 rounded-lg p-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </div>
        <h3 class="text-xl font-bold text-white">Editar Tarea</h3>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="text-white hover:bg-white/20 rounded-lg p-2 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="overflow-y-auto flex-1 p-6">
      <form (ngSubmit)="onSubmit()">
        <!-- Error Message -->
        <div *ngIf="error" class="mb-4 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg flex items-start gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-sm">{{ error }}</span>
        </div>

        <!-- Nombre de la tarea -->
        <div class="mb-5">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Nombre de la tarea <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            [(ngModel)]="nombre"
            name="nombre"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700"
            placeholder="Ingresa el nombre de la tarea"
            required>
        </div>

        <!-- Descripción -->
        <div class="mb-5">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Descripción</label>
          <textarea
            [(ngModel)]="descripcion"
            name="descripcion"
            rows="3"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700 resize-none"
            placeholder="Describe la tarea..."></textarea>
        </div>

        <!-- Fechas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha de inicio</label>
            <input
              type="date"
              [(ngModel)]="fechaInicio"
              name="fechaInicio"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha de vencimiento</label>
            <input
              type="date"
              [(ngModel)]="fechaVencimiento"
              name="fechaVencimiento"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700">
          </div>
        </div>

        <!-- Prioridad y Estado -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Prioridad</label>
            <select
              [(ngModel)]="prioridad"
              name="prioridad"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700">
              <option *ngFor="let p of prioridades" [value]="p">{{ p }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Estado</label>
            <select
              [(ngModel)]="estado"
              name="estado"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700">
              <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
            </select>
          </div>
        </div>

        <!-- Categoría -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Categoría</label>
          <input
            type="text"
            [(ngModel)]="categoria"
            name="categoria"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700"
            placeholder="ej: Frontend, Backend, Diseño...">
        </div>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-gray-200">
          <button
            type="button"
            (click)="onClose()"
            class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors font-medium order-2 sm:order-1">
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="loading"
            class="px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl flex items-center justify-center gap-2 order-1 sm:order-2">
            <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span *ngIf="!loading">Guardar Cambios</span>
            <span *ngIf="loading">Guardando...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
