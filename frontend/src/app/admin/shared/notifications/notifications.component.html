<div class="fixed right-4 top-16 z-50 bg-white shadow-xl border border-gray-200 rounded-xl w-96 max-w-sm overflow-hidden">
  <!-- Header with gradient -->
  <div class="flex justify-between items-center p-4 border-b border-gray-200 bg-gradient-to-r from-primary-50 to-primary-100">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <h3 class="font-bold text-gray-800 text-lg">Notificaciones</h3>
    </div>
    <button
      (click)="markAllAsRead()"
      class="text-primary-600 text-xs font-medium hover:text-primary-700 hover:bg-primary-50 px-3 py-1.5 rounded-lg transition-all duration-200"
      *ngIf="unreadNotifications.length > 0"
    >
      Marcar todas leídas
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="py-12 text-center">
    <div class="mx-auto mb-3 w-10 h-10 border-4 border-gray-200 border-t-primary-600 rounded-full animate-spin"></div>
    <p class="text-gray-500 text-sm">Cargando notificaciones...</p>
  </div>

  <!-- Empty state -->
  <div *ngIf="!loading && notifications.length === 0" class="py-12 text-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto mb-3 w-16 h-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <p class="text-gray-600 font-medium text-sm">No tienes notificaciones</p>
    <p class="text-gray-400 text-xs mt-1">Te avisaremos cuando recibas algo nuevo</p>
  </div>

  <!-- Notifications list -->
  <div *ngIf="!loading && notifications.length > 0" class="divide-y divide-gray-100 max-h-[28rem] overflow-y-auto">
    <!-- Unread section -->
    <div *ngIf="unreadNotifications.length > 0">
      <div class="sticky top-0 bg-gray-50 px-4 py-2 border-b border-gray-100">
        <div class="flex items-center gap-2">
          <span class="font-bold text-gray-700 text-xs uppercase tracking-wide">Sin leer</span>
          <span class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{{ unreadNotifications.length }}</span>
        </div>
      </div>
      <div *ngFor="let n of unreadNotifications"
           class="hover:bg-primary-50 p-4 cursor-pointer transition-all duration-200 border-l-4 border-primary-500"
           (click)="markAsRead(n)">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 bg-primary-500 rounded-full w-2.5 h-2.5 mt-1.5 shadow-lg"></div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-gray-800 text-sm leading-snug">{{ n.mensaje }}</p>
            <p class="mt-1 text-gray-500 text-xs">{{ n.fechaCreacion | date:'short' }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Read section -->
    <div *ngIf="readNotifications.length > 0">
      <div class="sticky top-0 bg-gray-50 px-4 py-2 border-b border-gray-100">
        <span class="font-bold text-gray-700 text-xs uppercase tracking-wide">Recientes</span>
      </div>
      <div *ngFor="let n of readNotifications"
           class="hover:bg-gray-50 p-4 transition-all duration-200 border-l-4 border-transparent opacity-75">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 bg-gray-300 rounded-full w-2.5 h-2.5 mt-1.5"></div>
          <div class="flex-1 min-w-0">
            <p class="text-gray-700 text-sm leading-snug">{{ n.mensaje }}</p>
            <p class="mt-1 text-gray-400 text-xs">{{ n.fechaCreacion | date:'short' }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="border-t border-gray-200 bg-gray-50">
    <button class="w-full py-3 text-primary-600 hover:bg-primary-50 text-sm font-medium transition-colors duration-200">
      Ver todas las notificaciones
    </button>
  </div>
</div>
