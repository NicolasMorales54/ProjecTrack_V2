<!-- Sidebar Moderno - Projectrack Admin -->
<div
  class="flex flex-col h-screen bg-white border-r border-gray-200 fixed left-0 top-0 z-40 shadow-sm transition-all duration-300"
  [ngClass]="isCollapsed ? 'w-20' : 'w-64'">

  <!-- Header con Logo -->
  <div class="flex items-center gap-3 px-6 py-6 border-b border-gray-200 flex-shrink-0">
    <img src="ufpslogo.png" class="w-10 h-10 rounded-lg flex-shrink-0" alt="UFPS Logo" />
    <div *ngIf="!isCollapsed" class="flex flex-col overflow-hidden">
      <span class="font-bold text-gray-900 text-lg leading-tight">Projectrack</span>
      <span *ngIf="currentUser" class="text-gray-500 text-xs truncate max-w-[140px]">
        {{ currentUser.primerNombre }} {{ currentUser.primerApellido }}
      </span>
    </div>
  </div>

  <!-- Navigation - Fixed height calculation -->
  <nav class="flex-1 overflow-hidden px-4 py-8 flex flex-col" style="height: calc(100vh - 180px);">
    <!-- Main Actions -->
    <div class="space-y-3 mb-8 flex-shrink-0">
      <a
        routerLink="/admin/all-users"
        routerLinkActive="bg-primary-50 text-primary-700 font-medium"
        [routerLinkActiveOptions]="{exact: false}"
        [title]="isCollapsed ? 'Usuarios del Sistema' : ''"
        class="flex items-center gap-3 px-3 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition-all duration-200 group"
        [ngClass]="isCollapsed ? 'justify-center' : ''">
        <i-lucide [img]="squareUserRound" [size]="22" class="text-gray-500 group-hover:text-primary-600 flex-shrink-0"></i-lucide>
        <span *ngIf="!isCollapsed" class="text-sm">Usuarios del Sistema</span>
      </a>

      <a
        routerLink="/admin/all-projects"
        routerLinkActive="bg-primary-50 text-primary-700 font-medium"
        [routerLinkActiveOptions]="{exact: false}"
        [title]="isCollapsed ? 'Todos los Proyectos' : ''"
        class="flex items-center gap-3 px-3 py-3 rounded-lg text-gray-700 hover:bg-gray-100 transition-all duration-200 group"
        [ngClass]="isCollapsed ? 'justify-center' : ''">
        <i-lucide [img]="folderKanban" [size]="22" class="text-gray-500 group-hover:text-primary-600 flex-shrink-0"></i-lucide>
        <span *ngIf="!isCollapsed" class="text-sm">Todos los Proyectos</span>
      </a>
    </div>

    <!-- Divider -->
    <div *ngIf="!isCollapsed" class="border-t border-gray-200 mb-8 flex-shrink-0"></div>

    <!-- My Projects Section - Scrollable -->
    <div *ngIf="!isCollapsed" class="flex-1 overflow-hidden flex flex-col min-h-0">
      <div class="flex justify-between items-center px-3 mb-4 flex-shrink-0">
        <span class="font-semibold text-gray-900 text-sm">Mis Proyectos</span>
        <a
          routerLink="/admin/create-project"
          class="flex justify-center items-center w-8 h-8 rounded-lg bg-primary-100 hover:bg-primary-200 text-primary-700 transition-colors duration-200"
          title="Crear Proyecto">
          <i-lucide [img]="plus" [size]="18"></i-lucide>
        </a>
      </div>

      <!-- Virtual Scroll Projects - Takes remaining space -->
      <div class="flex-1 overflow-auto projects-scroll-container">
        <cdk-virtual-scroll-viewport itemSize="60" class="h-full">
          <div *cdkVirtualFor="let item of virtualScrollItems; trackBy: trackVirtualItem">
            <!-- Group Header -->
            <div *ngIf="item.type === 'header'" class="px-3 py-3 mb-2">
              <div class="flex items-center gap-2">
                <div class="w-1 h-4 bg-primary-500 rounded-full"></div>
                <span class="font-medium text-gray-700 text-xs uppercase tracking-wide">
                  {{ item.groupDisplayName }} ({{ getGroupData(item).projects.length }})
                </span>
              </div>
            </div>

            <!-- Project Item -->
            <div *ngIf="item.type === 'project'" class="mb-2">
              <button
                type="button"
                (click)="toggleProjectAccordion(getProject(item).id)"
                class="flex justify-between items-center w-full px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors duration-200 group">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                  <span
                    [ngClass]="getColor(getProject(item).id)"
                    class="w-2.5 h-2.5 rounded-full flex-shrink-0"></span>
                  <span class="text-sm truncate">{{ getProject(item).nombre }}</span>
                </div>
                <svg
                  class="w-4 h-4 text-gray-400 transition-transform duration-200 flex-shrink-0"
                  [class.rotate-180]="isProjectExpanded(getProject(item).id)"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2">
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>

              <!-- Submenu -->
              <div
                *ngIf="isProjectExpanded(getProject(item).id)"
                [@slideDown]
                class="ml-6 mt-2 space-y-1">
                <a
                  [routerLink]="['/admin/project', getProject(item).id, 'resumen']"
                  routerLinkActive="bg-primary-50 text-primary-700"
                  class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors duration-200 text-sm">
                  <i-lucide [img]="clipboardList" [size]="16" class="text-gray-400"></i-lucide>
                  Resumen
                </a>
                <a
                  [routerLink]="['/admin/project', getProject(item).id, 'kanban']"
                  routerLinkActive="bg-primary-50 text-primary-700"
                  class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors duration-200 text-sm">
                  <i-lucide [img]="layoutGrid" [size]="16" class="text-gray-400"></i-lucide>
                  Kanban
                </a>
                <a
                  [routerLink]="['/admin/project', getProject(item).id, 'cronograma']"
                  routerLinkActive="bg-primary-50 text-primary-700"
                  class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors duration-200 text-sm">
                  <i-lucide [img]="ganttChart" [size]="16" class="text-gray-400"></i-lucide>
                  Cronograma
                </a>
                <a
                  [routerLink]="['/admin/project', getProject(item).id, 'users']"
                  routerLinkActive="bg-primary-50 text-primary-700"
                  class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors duration-200 text-sm">
                  <i-lucide [img]="userRound" [size]="16" class="text-gray-400"></i-lucide>
                  Usuarios
                </a>
              </div>
            </div>
          </div>
        </cdk-virtual-scroll-viewport>
      </div>
    </div>
  </nav>

  <!-- Footer -->
  <div class="border-t border-gray-200 px-4 py-4 flex-shrink-0">
    <div *ngIf="!isCollapsed" class="flex items-center gap-2 px-3 py-2.5 rounded-lg bg-gray-50">
      <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse flex-shrink-0"></div>
      <span class="text-xs text-gray-600">Sistema activo</span>
    </div>
    <div *ngIf="isCollapsed" class="flex justify-center">
      <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
    </div>
  </div>
</div>
