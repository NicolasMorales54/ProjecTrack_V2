<div class="flex h-screen">
  <app-sidebar></app-sidebar>
  <div class="flex flex-col flex-1 bg-gray-50 transition-all duration-300" [ngClass]="sidebarCollapsed ? 'ml-20' : 'ml-64'">
    <!-- Navbar -->
    <div class="flex justify-between items-center bg-white shadow px-6 py-4">
      <div class="flex items-center gap-4">
        <!-- Toggle Sidebar Button -->
        <button
          (click)="toggleSidebar()"
          class="p-2 text-gray-600 hover:text-primary-600 hover:bg-gray-100 rounded-lg transition-colors duration-200"
          title="Ocultar/Mostrar Sidebar">
          <i-lucide [img]="menu" [size]="24"></i-lucide>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <!-- Notificaciones -->
        <app-notifications-dropdown></app-notifications-dropdown>

        <!-- Mensajes -->
        <button (click)="goToInbox()" class="p-2 text-gray-600 hover:text-primary-600 hover:bg-gray-100 rounded-lg transition-colors duration-200">
          <i-lucide [img]="mail" [size]="24"></i-lucide>
        </button>

        <!-- Ajustes -->
        <app-settings-dropdown (openChangePassword)="openChangePasswordModal()"></app-settings-dropdown>

        <!-- Usuario -->
        <app-user-dropdown></app-user-dropdown>
      </div>
    </div>

    <!-- Change Password Modal -->
    <app-modal-change-password
      [isOpen]="showChangePasswordModal"
      (closeModal)="closeChangePasswordModal()"
      (passwordChanged)="closeChangePasswordModal()"
    ></app-modal-change-password>

    <!-- Content -->
    <div class="flex-1 p-6 overflow-auto">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
