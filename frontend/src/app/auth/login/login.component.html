<div class="flex bg-gray-50 min-h-screen">
  <!-- Left Panel (Image) -->
  <div class="hidden relative md:flex flex-col justify-between rounded-l-2xl w-1/2 overflow-hidden">
    <img src="gestion.png" alt="Mountain" class="z-0 absolute inset-0 w-full h-full object-cover"
      style="border-bottom-left-radius: 1rem" />

    <div class="z-10 absolute inset-0 bg-blue-900/40"></div>

    <div class="z-20 relative flex justify-between items-center p-6">
      <div class="flex items-center gap-2">
        <img src="logo1.png" alt="Logo" class="shadow rounded-full w-8 h-8" />
        <span class="font-bold text-white text-lg">ProjecTrack</span>
      </div>
    </div>
    <div class="z-20 relative flex flex-col flex-1 justify-center items-center px-8">
      <h1 class="text-gray-800 drop-shadow-lg font-extrabold text-white text-4xl md:text-5xl text-center leading-tight">
        Optimizando la gestión de proyectos<br />
        Asignación de tareas<br />
        Y el éxito.
      </h1>
    </div>
  </div>

  <!-- Right Panel (Login Form) -->
  <div class="flex flex-col justify-center items-center bg-white px-8 py-12 rounded-r-2xl w-full md:w-1/2">
    <div class="w-full max-w-md">
      <!-- Header con icono -->
      <div class="mb-8 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-100 rounded-full mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
          </svg>
        </div>
        <h2 class="font-extrabold text-gray-800 text-3xl">Bienvenido a ProjecTrack</h2>
        <p class="mt-2 text-gray-600 text-sm">Ingresa tus credenciales para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
            Correo Electrónico
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
            <input
              id="email"
              type="email"
              formControlName="correoElectronico"
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700 placeholder-gray-400"
              placeholder="yo@ufps.edu.co"
              autocomplete="email" />
          </div>
          <div *ngIf="loginForm.get('correoElectronico')?.touched && loginForm.get('correoElectronico')?.invalid"
            class="mt-2 text-red-600 text-sm flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span *ngIf="loginForm.get('correoElectronico')?.errors?.['required']">El correo es obligatorio</span>
            <span *ngIf="loginForm.get('correoElectronico')?.errors?.['email']">Correo inválido</span>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input
              id="password"
              type="password"
              formControlName="contrasena"
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all text-gray-700 placeholder-gray-400"
              placeholder="••••••••"
              autocomplete="current-password" />
          </div>
          <div *ngIf="loginForm.get('contrasena')?.touched && loginForm.get('contrasena')?.invalid"
            class="mt-2 text-red-600 text-sm flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>La contraseña es obligatoria</span>
          </div>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          [disabled]="loading || loginForm.invalid"
          class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}</span>
        </button>

        <!-- Forgot password link -->
        <div class="text-center pt-4">
          <a routerLink="/recover-password" class="text-primary-600 hover:text-primary-700 text-sm font-medium hover:underline inline-flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
